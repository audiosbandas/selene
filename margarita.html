<body>

    <!-- BARRA FLOTANTE CONTROLADA POR VISUAL VIEWPORT -->

    <script>
        // --- 1. LIMPIEZA AUTOMÁTICA DE CACHÉ AL INICIAR LA PÁGINA ---
        (async function borrarCachePagina() {
            try {
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(key => caches.delete(key)));
                }
                sessionStorage.clear();
            } catch (e) {
                console.warn("No se pudo borrar parte de la caché local:", e);
            }
        })();

        const ID_HOJA = '2PACX-1vS8yI_vyMAo44MNjXcV_WZskR24ld2Fh_GKdmXxmKSgfA5XNNLmJH1klnBcC93kXbtN7dm0Nj43aLEw';
        const GID = '574446661';        //margarita.html

        //const GID = '1726751477';        //tablaclaudep1.html  

        let bloqueActual = 0; // 0 = Izquierda (Cols 1 a 17), 1 = Derecha (Cols 18+)
        let totalColumnas = 0;
        let datosFilas = []; // copia de los datos cargados (usada por la exportación)
        const LIMITE_PRIMER_BLOQUE = 17;
        const ANCHO_COL_1_17 = 32;
        const ANCHO_COL_18_MAS = 50;

        // --- 2. BARRA FLOTANTE: SIGUE AL VISUAL VIEWPORT (ZOOM Y PANEO TÁCTIL) ---
        function reajustarBarraFlotante() {
            const barra = document.getElementById('barra-flotante');
            if (!barra || !window.visualViewport) return;

            const vv = window.visualViewport;
            const anchoLayout = document.documentElement.clientWidth;

            const desplX = vv.offsetLeft + vv.width - anchoLayout;
            const desplY = vv.offsetTop;

            barra.style.transform = `translate(${desplX}px, ${desplY}px) scale(${1 / vv.scale})`;
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('scroll', reajustarBarraFlotante);
            window.visualViewport.addEventListener('resize', reajustarBarraFlotante);
        }
        window.addEventListener('scroll', reajustarBarraFlotante, { passive: true });

        // --- 2b. FILAS CONGELADAS: LAS PRIMERAS 3 FILAS (ENCABEZADO + 2) QUEDAN FIJAS ARRIBA ---
        const FILAS_CONGELADAS = 3;
        let _filasCongeladas = [];
        let _celdasCongeladas = [];
        let _congeladasPendiente = false;

        // Se llama una vez, después de dibujar la tabla
        function marcarFilasCongeladas() {
            _filasCongeladas = [];
            _celdasCongeladas = [];

            const filaEnc = document.querySelector("#tabla-dinamica thead tr");
            if (filaEnc) _filasCongeladas.push(filaEnc);

            const filasCuerpo = Array.from(document.querySelectorAll("#tabla-dinamica tbody tr"));
            for (let i = 0; i < filasCuerpo.length && _filasCongeladas.length < FILAS_CONGELADAS; i++) {
                _filasCongeladas.push(filasCuerpo[i]);
            }

            _filasCongeladas.forEach((fila) => {
                Array.from(fila.cells).forEach((celda) => {
                    celda.classList.add("congelada");
                    if (celda.querySelector(".celda")) celda.classList.add("con-texto");
                    _celdasCongeladas.push(celda);
                });
            });
        }

        // Desplaza las celdas de las filas congeladas para que acompañen el scroll vertical de la página
        function actualizarFilasCongeladas() {
            if (!_filasCongeladas.length) return;

            const visor = document.getElementById("visor-tabla");
            const tabla = document.getElementById("tabla-dinamica");
            const escala = escalaActual();
            if (!escala) return;

            const topPagina = visor.getBoundingClientRect().top + window.scrollY;
            const rPrimera = _filasCongeladas[0].getBoundingClientRect();
            const rUltima = _filasCongeladas[_filasCongeladas.length - 1].getBoundingClientRect();
            const altoCongeladas = rUltima.bottom - rPrimera.top;
            const altoTabla = tabla.getBoundingClientRect().height;

            // Opción B: las filas quedan fijas justo debajo de la barra flotante
            const barra = document.getElementById("barra-flotante");
            const topFijo = barra ? barra.getBoundingClientRect().bottom + 2 : 0;

            // Desplazamiento en píxeles de pantalla: nunca negativo, y sin salirse por debajo de la tabla
            let despl = Math.max(0, window.scrollY + topFijo - topPagina);
            despl = Math.min(despl, Math.max(0, altoTabla - altoCongeladas));

            // El desplazamiento se aplica dentro del contenido escalado, por eso se divide por la escala
            const valor = despl > 0 ? `translateY(${despl / escala}px)` : "";
            for (let i = 0; i < _celdasCongeladas.length; i++) {
                _celdasCongeladas[i].style.transform = valor;
            }
        }

        function programarActualizacionCongeladas() {
            if (_congeladasPendiente) return;
            _congeladasPendiente = true;
            requestAnimationFrame(() => {
                _congeladasPendiente = false;
                actualizarFilasCongeladas();
            });
        }

        window.addEventListener('scroll', programarActualizacionCongeladas, { passive: true });

        // --- 3. NAVEGACIÓN Y AJUSTE INICIAL AL ANCHO DE PANTALLA ---
        let zoomUsuario = 1;
        let escalaBase = 1;
        const ZOOM_MAXIMO = 8;

        function cambiarBloque(direccion) {
            const nuevo = bloqueActual + direccion;
            if (nuevo < 0 || nuevo > 1) return;
            if (nuevo === 1 && totalColumnas <= LIMITE_PRIMER_BLOQUE) return;
            bloqueActual = nuevo;

            zoomUsuario = 1;
            aplicarZoomOptimo();

            reajustarBarraFlotante();
        }

        function escalaActual() {
            return escalaBase * zoomUsuario;
        }

        function aplicarEscala(escala) {
            const contenedor = document.getElementById("contenedor-escalado");
            const tabla = document.getElementById("tabla-dinamica");

            if ('zoom' in contenedor.style) {
                contenedor.style.zoom = escala;
                contenedor.style.width = "";
                contenedor.style.height = "";
                tabla.style.transform = "";
            } else {
                const anchoTotal = Math.min(totalColumnas, LIMITE_PRIMER_BLOQUE) * ANCHO_COL_1_17
                    + Math.max(0, totalColumnas - LIMITE_PRIMER_BLOQUE) * ANCHO_COL_18_MAS;
                tabla.style.transform = `scale(${escala})`;
                contenedor.style.width = `${anchoTotal * escala}px`;
                contenedor.style.height = `${tabla.offsetHeight * escala}px`;
            }

            // Reubica las filas congeladas con la nueva escala
            actualizarFilasCongeladas();
        }

        function aplicarZoomOptimo() {
            const visor = document.getElementById("visor-tabla");
            const tabla = document.getElementById("tabla-dinamica");
            const btnPrev = document.getElementById("btn-prev");
            const btnNext = document.getElementById("btn-next");
            const indicador = document.getElementById("indicador-bloque");

            if (!totalColumnas) return;

            const colsBloque1 = Math.min(totalColumnas, LIMITE_PRIMER_BLOQUE);
            const colsBloque2 = Math.max(0, totalColumnas - LIMITE_PRIMER_BLOQUE);

            const anchoBloque1 = colsBloque1 * ANCHO_COL_1_17;
            const anchoBloque2 = colsBloque2 * ANCHO_COL_18_MAS;

            const anchoDisponible = document.documentElement.clientWidth - 30;

            let anchoObjetivo;
            let inicioBloque;

            if (bloqueActual === 0) {
                anchoObjetivo = anchoBloque1;
                inicioBloque = 0;
                btnPrev.disabled = true;
                btnNext.disabled = totalColumnas <= LIMITE_PRIMER_BLOQUE;
                indicador.innerText = `Cols 1 - ${colsBloque1}`;
            } else {
                anchoObjetivo = anchoBloque2;
                inicioBloque = anchoBloque1;
                btnPrev.disabled = false;
                btnNext.disabled = true;
                indicador.innerText = `Cols ${LIMITE_PRIMER_BLOQUE + 1} - ${totalColumnas}`;
            }

            if (anchoObjetivo === 0) return;

            escalaBase = anchoDisponible / anchoObjetivo;
            aplicarEscala(escalaActual());

            tabla.style.visibility = "visible";
            visor.scrollLeft = inicioBloque * escalaActual();

            reajustarBarraFlotante();
        }

        // --- 3b. ZOOM POR PELLIZCO SIMULADO ---
        let pellizco = null;
        let cuadroPendiente = false;
        let ultimoPunto = null;

        function distanciaDedos(toques) {
            return Math.hypot(toques[0].clientX - toques[1].clientX, toques[0].clientY - toques[1].clientY);
        }

        function puntoMedio(toques) {
            return {
                x: (toques[0].clientX + toques[1].clientX) / 2,
                y: (toques[0].clientY + toques[1].clientY) / 2
            };
        }

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 2 || !totalColumnas) {
                if (e.touches.length > 2) pellizco = null;
                return;
            }

            const visor = document.getElementById("visor-tabla");
            const r = visor.getBoundingClientRect();
            const p = puntoMedio(e.touches);
            const escala0 = escalaActual();

            pellizco = {
                d0: distanciaDedos(e.touches),
                zoom0: zoomUsuario,
                izquierdaVisor: r.left,
                contenidoX: (visor.scrollLeft + p.x - r.left) / escala0,
                contenidoY: (p.y - r.top) / escala0,
                topPagina: r.top + window.scrollY
            };
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!pellizco || e.touches.length !== 2) return;

            if (e.cancelable) e.preventDefault();

            const d = distanciaDedos(e.touches);
            zoomUsuario = Math.min(ZOOM_MAXIMO, Math.max(1, pellizco.zoom0 * (d / pellizco.d0)));
            ultimoPunto = puntoMedio(e.touches);

            if (cuadroPendiente) return;
            cuadroPendiente = true;

            requestAnimationFrame(() => {
                cuadroPendiente = false;
                if (!pellizco || !ultimoPunto) return;

                const visor = document.getElementById("visor-tabla");
                const escala = escalaActual();

                aplicarEscala(escala);

                visor.scrollLeft = pellizco.contenidoX * escala - (ultimoPunto.x - pellizco.izquierdaVisor);
                window.scrollTo(window.scrollX, pellizco.contenidoY * escala + pellizco.topPagina - ultimoPunto.y);
            });
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) pellizco = null;
        }, { passive: true });

        document.addEventListener('touchcancel', () => { pellizco = null; }, { passive: true });

        ['gesturestart', 'gesturechange', 'gestureend'].forEach((nombre) => {
            document.addEventListener(nombre, (e) => e.preventDefault(), { passive: false });
        });

        // --- 4. LECTOR CSV CON SOPORTE DE FILAS VACÍAS Y RECORTE FINAL ---
        function parsearCSV(texto) {
            const filas = [];
            let fila = [];
            let celda = "";
            let enComillas = false;

            for (let i = 0; i < texto.length; i++) {
                const c = texto[i];

                if (enComillas) {
                    if (c === '"') {
                        if (texto[i + 1] === '"') { celda += '"'; i++; }
                        else { enComillas = false; }
                    } else {
                        celda += c;
                    }
                } else if (c === '"') {
                    enComillas = true;
                } else if (c === ',') {
                    fila.push(celda.trim());
                    celda = "";
                } else if (c === '\n' || c === '\r') {
                    if (c === '\r' && texto[i + 1] === '\n') i++;
                    fila.push(celda.trim());
                    celda = "";
                    filas.push(fila); // Conserva las filas intermedias vacías
                    fila = [];
                } else {
                    celda += c;
                }
            }
            fila.push(celda.trim());
            filas.push(fila);

            // Buscar la última fila que contenga al menos una celda con datos
            let ultimaFilaConDatos = -1;
            for (let i = filas.length - 1; i >= 0; i--) {
                if (filas[i].some(v => v !== "")) {
                    ultimaFilaConDatos = i;
                    break;
                }
            }

            // Recortar las filas vacías que estén después de la última fila con datos
            if (ultimaFilaConDatos !== -1) {
                return filas.slice(0, ultimaFilaConDatos + 1);
            }

            return [];
        }

        function escaparHTML(t) {
            return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- 4b. DESBORDAMIENTO DEL TEXTO SOBRE CELDAS VECINAS VACÍAS ---
        function anchoColumna(idx) {
            return idx < LIMITE_PRIMER_BLOQUE ? ANCHO_COL_1_17 : ANCHO_COL_18_MAS;
        }

        function anchosDisponibles(fila, totalCols) {
            const res = new Array(totalCols).fill(0);
            for (let i = 0; i < totalCols; i++) {
                const val = fila[i] || "";
                if (val === "") continue;
                let ancho = anchoColumna(i);
                const limite = i < LIMITE_PRIMER_BLOQUE ? Math.min(totalCols, LIMITE_PRIMER_BLOQUE) : totalCols;
                for (let j = i + 1; j < limite && (!fila[j] || fila[j] === ""); j++) {
                    ancho += anchoColumna(j);
                }
                res[i] = ancho;
            }
            return res;
        }

        function celdaHTML(texto, ancho) {
            if (!texto) return '&nbsp;';
            const maxAncho = Math.max(0, ancho - 6);
            return `<div class="celda"><span style="max-width:${maxAncho}px">${escaparHTML(texto)}</span></div>`;
        }

        // --- 5. EXPORTAR A .DOCX / .PDF (A4 vertical, márgenes estrechos) ---
        // Cada opción del menú Exportar tiene su propia configuración:
        //   colInicio: primera columna exportada (numeración 1-based)
        //   texto:     texto que debe entrar en UNA línea dentro de una celda (define el tamaño de letra)
        //   prefijo:   nombre del archivo .docx (se le agrega _AAAA-MM-DD.docx)
        //   prefijoPdf: nombre del archivo .pdf (se le agrega _AAAA-MM-DD.pdf)
        const EXP_OPCIONES = {
            grados:  { colInicio: 1,  texto: "IVaum",  prefijo: "ExportGRADOS",  prefijoPdf: "PDF_GRADOS" },
            acordes: { colInicio: 19, texto: "C# dim", prefijo: "ExportACORDES", prefijoPdf: "PDF_ACORDES" }
        };
        const EXP_CANT_COLS = 17;             // cantidad de columnas del documento (todas de igual ancho)
        const EXP_PAGINA_ANCHO = 11906;       // A4 vertical, en twips (1 pt = 20 twips)
        const EXP_PAGINA_ALTO = 16838;
        const EXP_MARGEN = 720;               // 0,5" = margen "Estrecho" de Word
        const EXP_PADDING_CELDA = 30;         // relleno izquierdo/derecho de cada celda (twips)
        const EXP_FUENTE = "Arial";
        const EXP_SEGURIDAD = 0.96;           // pequeño margen de seguridad en la medición del texto

        // Menú desplegable del botón Exportar
        function alternarMenuExportar(e) {
            if (e) e.stopPropagation();
            document.getElementById("opciones-exportar").classList.toggle("abierto");
        }
        function cerrarMenuExportar() {
            document.getElementById("opciones-exportar").classList.remove("abierto");
        }
        document.addEventListener("click", (e) => {
            if (!e.target.closest(".menu-exportar")) cerrarMenuExportar();
        });

        function escaparXML(t) {
            return String(t)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
        }

        let _ctxMedir = null;
        // Ancho (en puntos) que ocupa un texto con el tamaño de letra indicado (en pt)
        function medirTextoPt(texto, tamPt, negrita) {
            if (!_ctxMedir) _ctxMedir = document.createElement("canvas").getContext("2d");
            _ctxMedir.font = `${negrita ? "bold " : ""}100px ${EXP_FUENTE}, Helvetica, sans-serif`;
            return _ctxMedir.measureText(texto).width * tamPt / 100;
        }

        // Recorta el texto con "…" si aun así no entra en el ancho disponible (para mantener UNA sola línea)
        function ajustarTextoAlAncho(texto, anchoPt, tamPt, negrita) {
            if (medirTextoPt(texto, tamPt, negrita) <= anchoPt) return texto;
            let t = texto;
            while (t.length > 1 && medirTextoPt(t + "…", tamPt, negrita) > anchoPt) t = t.slice(0, -1);
            return t.trimEnd() + "…";
        }

        function exportarDocx(tipo) {
            cerrarMenuExportar();

            const opcion = EXP_OPCIONES[tipo];
            if (!opcion) { alert("Opción de exportación desconocida."); return; }

            const btn = document.getElementById("btn-exportar");
            try {
                if (!datosFilas.length) { alert("Todavía no hay datos cargados para exportar."); return; }
                if (typeof JSZip === "undefined") { alert("No se pudo cargar la librería de exportación (JSZip). Revisa la conexión e intenta de nuevo."); return; }

                btn.disabled = true;

                // Geometría: ancho útil dividido en 17 columnas iguales
                const anchoUtil = EXP_PAGINA_ANCHO - 2 * EXP_MARGEN;               // 10466 twips
                const anchoCol = Math.floor(anchoUtil / EXP_CANT_COLS);            // 615 twips
                const anchoTabla = anchoCol * EXP_CANT_COLS;
                const anchoInteriorPt = (anchoCol - 2 * EXP_PADDING_CELDA) / 20;

                // Tamaño de letra: el mayor (en pasos de 0,5 pt) con el que el texto de referencia entra en una sola línea
                const anchoRefPorPt = medirTextoPt(opcion.texto, 1, false);
                const tamPt = Math.max(1, Math.floor((anchoInteriorPt / anchoRefPorPt) * EXP_SEGURIDAD * 2) / 2);
                const sz = Math.round(tamPt * 2); // medio-puntos para Word

                const iniIdx = opcion.colInicio - 1;

                const rPr = (negrita) =>
                    `<w:rPr><w:rFonts w:ascii="${EXP_FUENTE}" w:hAnsi="${EXP_FUENTE}" w:cs="${EXP_FUENTE}"/>${negrita ? "<w:b/>" : ""}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr>`;
                const pPr = (negrita) =>
                    `<w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="left"/>${rPr(negrita)}</w:pPr>`;

                const celdaVacia = (negrita) =>
                    `<w:tc><w:tcPr><w:tcW w:w="${anchoCol}" w:type="dxa"/></w:tcPr><w:p>${pPr(negrita)}</w:p></w:tc>`;

                let filasXML = "";
                for (let f = 0; f < datosFilas.length; f++) {
                    const fila = datosFilas[f];
                    const esEncabezado = (f === 0);
                    const valores = [];
                    for (let c = 0; c < EXP_CANT_COLS; c++) valores.push((fila[iniIdx + c] || "").toString());

                    let xml = `<w:tr><w:trPr><w:cantSplit/></w:trPr>`;
                    let c = 0;
                    while (c < EXP_CANT_COLS) {
                        const val = valores[c];
                        if (val === "") { xml += celdaVacia(esEncabezado); c++; continue; }

                        // El texto desborda hacia la derecha: se une con las celdas vecinas vacías
                        let span = 1;
                        while (c + span < EXP_CANT_COLS && valores[c + span] === "") span++;

                        const anchoCelda = anchoCol * span;
                        const anchoDispPt = (anchoCelda - 2 * EXP_PADDING_CELDA) / 20 * EXP_SEGURIDAD;
                        const texto = ajustarTextoAlAncho(val.replace(/\s+/g, " "), anchoDispPt, tamPt, esEncabezado);

                        xml += `<w:tc><w:tcPr><w:tcW w:w="${anchoCelda}" w:type="dxa"/>`
                            + (span > 1 ? `<w:gridSpan w:val="${span}"/>` : "")
                            + `<w:noWrap/></w:tcPr>`
                            + `<w:p>${pPr(esEncabezado)}<w:r>${rPr(esEncabezado)}<w:t xml:space="preserve">${escaparXML(texto)}</w:t></w:r></w:p></w:tc>`;
                        c += span;
                    }
                    xml += `</w:tr>`;
                    filasXML += xml;
                }

                const grilla = Array.from({ length: EXP_CANT_COLS }, () => `<w:gridCol w:w="${anchoCol}"/>`).join("");
                const borde = `<w:bottom w:val="single" w:sz="4" w:space="0" w:color="E2E8F0"/>`;

                const documentoXML =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>`
+ `<w:tbl><w:tblPr><w:tblW w:w="${anchoTabla}" w:type="dxa"/><w:tblInd w:w="0" w:type="dxa"/>`
+ `<w:tblBorders>${borde}</w:tblBorders><w:tblLayout w:type="fixed"/>`
+ `<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="${EXP_PADDING_CELDA}" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="${EXP_PADDING_CELDA}" w:type="dxa"/></w:tblCellMar></w:tblPr>`
+ `<w:tblGrid>${grilla}</w:tblGrid>${filasXML}</w:tbl>`
+ `<w:p><w:pPr><w:spacing w:before="0" w:after="0"/></w:pPr></w:p>`
+ `<w:sectPr><w:pgSz w:w="${EXP_PAGINA_ANCHO}" w:h="${EXP_PAGINA_ALTO}" w:orient="portrait"/>`
+ `<w:pgMar w:top="${EXP_MARGEN}" w:right="${EXP_MARGEN}" w:bottom="${EXP_MARGEN}" w:left="${EXP_MARGEN}" w:header="360" w:footer="360" w:gutter="0"/></w:sectPr>`
+ `</w:body></w:document>`;

                const contentTypes =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;

                const rels =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;

                const zip = new JSZip();
                zip.file("[Content_Types].xml", contentTypes);
                zip.file("_rels/.rels", rels);
                zip.file("word/document.xml", documentoXML);

                zip.generateAsync({
                    type: "blob",
                    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                    compression: "DEFLATE"
                }).then((blob) => {
                    const hoy = new Date();
                    const pad = (n) => String(n).padStart(2, "0");
                    const nombre = `${opcion.prefijo}_${hoy.getFullYear()}-${pad(hoy.getMonth() + 1)}-${pad(hoy.getDate())}.docx`;
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = nombre;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 10000);
                }).catch((err) => {
                    console.error("Error al generar el .docx:", err);
                    alert("No se pudo generar el archivo .docx: " + err.message);
                }).finally(() => { btn.disabled = false; });

            } catch (err) {
                console.error("Error al exportar:", err);
                alert("No se pudo exportar: " + err.message);
                btn.disabled = false;
            }
        }

        // --- 5b. EXPORTAR A .PDF (A4 vertical, márgenes estrechos, mismas reglas que el .docx) ---
        const PDF_PAGINA_ANCHO = 595.28;      // A4 vertical, en puntos
        const PDF_PAGINA_ALTO = 841.89;
        const PDF_MARGEN = 36;                // 0,5" = margen "Estrecho"
        const PDF_PADDING_CELDA = 1.5;        // relleno izquierdo/derecho de cada celda (pt)
        const PDF_INTERLINEADO = 1.3;         // alto de fila = tamaño de letra x este factor
        const PDF_SEGURIDAD = 0.96;

        // Reemplaza símbolos que la fuente estándar del PDF (Helvetica) no puede dibujar
        function limpiarTextoPdf(t) {
            return String(t)
                .replace(/\u266F/g, "#")      // ♯
                .replace(/\u266D/g, "b")      // ♭
                .replace(/\u266E/g, "")       // ♮
                .replace(/[\u2018\u2019]/g, "'")
                .replace(/\s+/g, " ")
                .trim();
        }

        function exportarPdf(tipo) {
            cerrarMenuExportar();

            const opcion = EXP_OPCIONES[tipo];
            if (!opcion) { alert("Opción de exportación desconocida."); return; }

            const btn = document.getElementById("btn-exportar");
            try {
                if (!datosFilas.length) { alert("Todavía no hay datos cargados para exportar."); return; }
                if (!window.jspdf || !window.jspdf.jsPDF) { alert("No se pudo cargar la librería de exportación (jsPDF). Revisa la conexión e intenta de nuevo."); return; }

                btn.disabled = true;

                const doc = new window.jspdf.jsPDF({ orientation: "portrait", unit: "pt", format: "a4", compress: true });

                // Geometría: ancho útil dividido en 17 columnas iguales
                const anchoUtil = PDF_PAGINA_ANCHO - 2 * PDF_MARGEN;
                const anchoCol = anchoUtil / EXP_CANT_COLS;
                const anchoInterior = anchoCol - 2 * PDF_PADDING_CELDA;

                // Mide el ancho (pt) de un texto con el tamaño y estilo indicados
                const medir = (texto, tam, negrita) => {
                    doc.setFont("helvetica", negrita ? "bold" : "normal");
                    doc.setFontSize(tam);
                    return doc.getTextWidth(texto);
                };

                // Tamaño de letra: el mayor (en pasos de 0,5 pt) con el que el texto de referencia entra en una sola línea
                const anchoRefPorPt = medir(opcion.texto, 100, false) / 100;
                const tamPt = Math.max(1, Math.floor((anchoInterior / anchoRefPorPt) * PDF_SEGURIDAD * 2) / 2);
                const altoFila = tamPt * PDF_INTERLINEADO;

                const recortar = (texto, anchoDisp, negrita) => {
                    if (medir(texto, tamPt, negrita) <= anchoDisp) return texto;
                    let t = texto;
                    while (t.length > 1 && medir(t + "…", tamPt, negrita) > anchoDisp) t = t.slice(0, -1);
                    return t.trimEnd() + "…";
                };

                const iniIdx = opcion.colInicio - 1;
                const xIni = PDF_MARGEN;
                const yMax = PDF_PAGINA_ALTO - PDF_MARGEN;
                let y = PDF_MARGEN;

                doc.setLineWidth(0.3);
                doc.setDrawColor(226, 232, 240);
                doc.setTextColor(0, 0, 0);

                for (let f = 0; f < datosFilas.length; f++) {
                    const fila = datosFilas[f];
                    const esEncabezado = (f === 0);

                    if (y + altoFila > yMax) {
                        doc.addPage();
                        y = PDF_MARGEN;
                        doc.setLineWidth(0.3);
                        doc.setDrawColor(226, 232, 240);
                        doc.setTextColor(0, 0, 0);
                    }

                    const valores = [];
                    for (let c = 0; c < EXP_CANT_COLS; c++) valores.push(limpiarTextoPdf(fila[iniIdx + c] || ""));

                    // Línea inferior de la fila
                    doc.line(xIni, y + altoFila, xIni + anchoUtil, y + altoFila);

                    let c = 0;
                    while (c < EXP_CANT_COLS) {
                        const val = valores[c];
                        if (val === "") { c++; continue; }

                        // El texto desborda hacia la derecha sobre las celdas vecinas vacías
                        let span = 1;
                        while (c + span < EXP_CANT_COLS && valores[c + span] === "") span++;

                        const anchoDisp = (anchoCol * span - 2 * PDF_PADDING_CELDA) * PDF_SEGURIDAD;
                        const texto = recortar(val, anchoDisp, esEncabezado);

                        doc.setFont("helvetica", esEncabezado ? "bold" : "normal");
                        doc.setFontSize(tamPt);
                        doc.text(texto, xIni + c * anchoCol + PDF_PADDING_CELDA, y + altoFila * 0.74);
                        c += span;
                    }

                    y += altoFila;
                }

                const hoy = new Date();
                const pad = (n) => String(n).padStart(2, "0");
                const nombre = `${opcion.prefijoPdf}_${hoy.getFullYear()}-${pad(hoy.getMonth() + 1)}-${pad(hoy.getDate())}.pdf`;
                doc.save(nombre);
                btn.disabled = false;

            } catch (err) {
                console.error("Error al exportar PDF:", err);
                alert("No se pudo generar el archivo .pdf: " + err.message);
                btn.disabled = false;
            }
        }

        async function cargarTabla() {
            const estado = document.getElementById("mensaje-estado");
            try {
                estado.innerText = "Descargando información en tiempo real...";

                const urlDirecta = `https://docs.google.com/spreadsheets/d/e/${ID_HOJA}/pub?gid=${GID}&single=true&output=csv&nocache=${Date.now()}`;

                const respuesta = await fetch(urlDirecta, {
                    cache: 'no-store',
                    headers: {
                        'Pragma': 'no-cache',
                        'Cache-Control': 'no-cache, no-store, max-age=0, must-revalidate'
                    }
                });

                if (!respuesta.ok) {
                    throw new Error("Google no respondió correctamente. Revisa el enlace.");
                }

                const datosTexto = await respuesta.text();
                estado.innerText = "Dibujando las filas de la tabla...";

                const filas = parsearCSV(datosTexto);
                if (filas.length === 0) throw new Error("La planilla no devolvió datos.");

                datosFilas = filas;

                const tablaHead = document.querySelector("#tabla-dinamica thead");
                const tablaBody = document.querySelector("#tabla-dinamica tbody");

                const claseColumna = (idx) =>
                    idx < LIMITE_PRIMER_BLOQUE ? 'class="col-32 b1"' : 'class="col-50 b2"';

                totalColumnas = filas[0].length;

                // Encabezado
                const anchosEnc = anchosDisponibles(filas[0], totalColumnas);
                let htmlHead = "<tr>";
                for (let idx = 0; idx < totalColumnas; idx++) {
                    const col = filas[0][idx] || "";
                    htmlHead += `<th ${claseColumna(idx)}>${celdaHTML(col, anchosEnc[idx])}</th>`;
                }
                htmlHead += "</tr>";
                tablaHead.innerHTML = htmlHead;

                // Cuerpo
                let htmlBody = "";
                for (let i = 1; i < filas.length; i++) {
                    const fila = filas[i];
                    const anchosFila = anchosDisponibles(fila, totalColumnas);
                    htmlBody += "<tr>";
                    for (let idx = 0; idx < totalColumnas; idx++) {
                        const col = fila[idx] || "";
                        htmlBody += `<td ${claseColumna(idx)}>${celdaHTML(col, anchosFila[idx])}</td>`;
                    }
                    htmlBody += "</tr>";
                }
                tablaBody.innerHTML = htmlBody;

                // Marca las primeras 3 filas como congeladas (antes del primer ajuste de escala)
                marcarFilasCongeladas();

                estado.style.display = "none";
                document.getElementById("btn-exportar").disabled = false;
                aplicarZoomOptimo();

            } catch (error) {
                console.error("Detalle:", error);
                estado.classList.add("error");
                estado.innerText = "Error: " + error.message;
            }
        }

        let ultimoAncho = document.documentElement.clientWidth;
        window.addEventListener("resize", () => {
            const ancho = document.documentElement.clientWidth;
            if (ancho !== ultimoAncho) {
                ultimoAncho = ancho;
                aplicarZoomOptimo();
            }
        });

        cargarTabla();
    </script>

</body>
